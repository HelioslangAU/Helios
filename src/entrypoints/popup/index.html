<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Helios</title>
    <!-- Palette, faces and shape come from `@/styles/theme.css`, imported by
         main.ts ahead of this surface's own stylesheet. Nothing here declares
         a colour or a font of its own. -->
  </head>
  <body>
    <div class="container">
      <header class="header">
        <div class="header-content">
          <div class="brand">
            <img class="brand-mark" src="/icons/icon128.png" alt="" width="20" height="20" />
            <h1>Helios</h1>
          </div>
          <div class="controls">
            <!-- Kept as a div with .active toggled by extensiontab.ts rather
                 than a checkbox; the script owns this element's state. -->
            <div class="toggle-switch active" id="extension-toggle" role="switch" aria-checked="true" tabindex="0" title="Turn Helios on or off">
              <div class="toggle-slider"></div>
            </div>
            <button class="settings-btn" id="settings-btn" title="Open settings" aria-label="Open settings">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
        </div>
      </header>

      <div class="content">
        <div class="words-learned">
          <div class="words-count" id="vocab-count">0</div>
          <div class="words-label">Words learned</div>
        </div>

        <section class="vocab-section">
          <div class="vocab-header">
            <h2 class="vocab-title">Recent vocabulary</h2>
            <span class="vocab-count" id="vocab-count-badge">0 total</span>
          </div>
          <!-- Rows are built by extensiontab.ts; the classes it writes are
               .vocab-item, .vocab-content, .vocab-word, .vocab-definition and
               .delete-btn. -->
          <div class="vocab-list" id="vocab-list"></div>
        </section>
      </div>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Helios</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="header">
      <!-- The marketing site's lockup: 36px mark, "Helios" at 24px bold with
           tight tracking, 12px between them. -->
      <div class="brand">
        <img class="brand-mark" src="/icons/icon128.png" alt="" width="36" height="36" />
        <span class="brand-name">Helios</span>
      </div>
      <!-- Kept as a div with .active toggled by extensiontab.ts rather than a
           checkbox; the script owns this element's state. -->
      <div class="toggle-switch active" id="extension-toggle" role="switch" aria-checked="true" tabindex="0" title="Turn Helios on or off">
        <div class="toggle-slider"></div>
      </div>
    </header>

    <button class="language" id="language-row" title="Change your target language in settings">
      <span class="flag" id="current-flag" aria-hidden="true"></span>
      <span class="language-text">
        <span class="language-name" id="current-language"></span>
        <span class="language-note" id="current-language-note"></span>
      </span>
      <svg class="language-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="9 18 15 12 9 6" />
      </svg>
    </button>

    <button class="settings-btn" id="settings-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
        <circle cx="12" cy="12" r="3" />
      </svg>
      <span>Settings</span>
    </button>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
